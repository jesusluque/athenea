# Copyright (c) 2026 jesus luque.
site_name: athenea
site_description: A relight baker for 3D Gaussian splatting from production USD assets
site_url: https://jesusluque.github.io/athenea/
repo_url: https://github.com/jesusluque/athenea
repo_name: jesusluque/athenea
edit_uri: ""
copyright: "© 2026 jesus luque"
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Light }
  font:
    text: DM Sans
    code: DM Mono

extra_css:
  - assets/athenea.css

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - assets/notes.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          site_description: Un baker de relight para 3D Gaussian splatting a partir de assets USD de producción
          nav_translations:
            Home: Inicio
            Architecture: Arquitectura
            Desktop installation: Instalación de escritorio
            Tutorials: Tutoriales
            From a USD asset to a baked cloud: De un asset USD a una nube con bake
            Rendering and comparing with the path trace: Render y comparación con el path trace
            Preparing a USD stage: Preparar un stage USD
            Large clouds and levels of detail: Nubes grandes y niveles de detalle
            Gaussian splats in Blender: Gaussian splats en Blender
            "OpenFX (Nuke, Natron)": "OpenFX (Nuke, Natron)"
            Reference: Referencia
            Paper: Paper
            Download: Descarga
            Abstract: Resumen
            1. Introduction: 1. Introducción
            2. The engine: 2. El motor
            3. Mesh to Gaussians: 3. De meshes a Gaussians
            4. Light transfer: 4. Transfer de luz
            5. Animated assets: 5. Assets animados
            6. Levels of detail: 6. Niveles de detalle
            7. The web format: 7. El formato web
            8. Evaluation: 8. Evaluación
            9. Limitations: 9. Limitaciones
            10. References and glossary: 10. Referencias y glosario
            Presentations: Presentaciones
            Credits: Créditos

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Desktop installation: install.md
  - Tutorials:
      - From a USD asset to a baked cloud: tutorials/usd-to-cloud.md
      - Rendering and comparing with the path trace: tutorials/render-compare.md
      - Preparing a USD stage: tutorials/authoring-usd.md
      - Large clouds and levels of detail: tutorials/large-clouds.md
      - Gaussian splats in Blender: tutorials/blender.md
  - "OpenFX (Nuke, Natron)": ofx.md
  - Reference: reference.md
  - Paper:
      - Download: paper.md
      - Abstract: paper/00-front.md
      - 1. Introduction: paper/01-introduction.md
      - 2. The engine: paper/02-engine.md
      - 3. Mesh to Gaussians: paper/03-conversion.md
      - 4. Light transfer: paper/04-transfer.md
      - 5. Animated assets: paper/05-animation.md
      - 6. Levels of detail: paper/06-lod.md
      - 7. The web format: paper/07-compression-player.md
      - 8. Evaluation: paper/08-evaluation.md
      - 9. Limitations: paper/09-limitations.md
      - 10. References and glossary: paper/10-references.md
  - Presentations: presentations.md
  - Credits: credits.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.details
  - def_list
  - pymdownx.arithmatex: { generic: true }
