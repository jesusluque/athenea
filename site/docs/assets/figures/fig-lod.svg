<text x="128" y="125" text-anchor="middle" font-size="11" fill="#9a4d42">ρ</text>
<path d="M 30,150 C 120,178 200,176 345,180" fill="none" stroke="#2f6b45" stroke-width="2" stroke-dasharray="6 3"/>
<text x="350" y="184" text-anchor="start" font-size="12" fill="#2f6b45" font-weight="bold">cut</text>
<text x="190" y="30" text-anchor="middle" font-size="11.5" fill="#1f2933" font-weight="bold">merge tree (per part, pair merges)</text>
<text x="190" y="296" text-anchor="middle" font-size="10.5" fill="#52606d" font-style="italic">leaves: baked Gaussians</text>
<rect x="20" y="312" width="352" height="60" rx="6" fill="#f1f1f1" stroke="#6b6b6b" stroke-width="1.3"/>
<text x="196.0" y="338.7" text-anchor="middle" font-size="10.2" fill="#52606d">node = sum of moments: W, Wμ, W(Σ+μμᵀ), colour, normal, …</text>
<text x="196.0" y="352.2" text-anchor="middle" font-size="10.2" fill="#52606d">ε monotone up the tree; sphere ρ covers the children’s</text>
<rect x="400" y="30" width="350" height="92" rx="6" fill="#e6f1ea" stroke="#4f7a5c" stroke-width="1.3"/>
<text x="575.0" y="59.4" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">cut by error</text>
<text x="575.0" y="77.3" text-anchor="middle" font-size="10.3" fill="#52606d">refine node n when P<tspan dy="2.9" font-size="7.4">n</tspan><tspan dy="-2.9"> = ε</tspan><tspan dy="2.9" font-size="7.4">n</tspan><tspan dy="-2.9"> p / max(d</tspan><tspan dy="2.9" font-size="7.4">n</tspan><tspan dy="-2.9"> − ρ</tspan><tspan dy="2.9" font-size="7.4">n</tspan><tspan dy="-2.9">, near) &gt; τ</tspan></text>
<text x="575.0" y="90.9" text-anchor="middle" font-size="10.3" fill="#52606d">ε: own error (cost, colour spread, normal cone)</text>
<text x="575.0" y="104.5" text-anchor="middle" font-size="10.3" fill="#52606d">τ in pixels; the cut is the set of nodes drawn</text>
<rect x="400" y="140" width="168" height="108" rx="6" fill="#fbf1df" stroke="#9a7433" stroke-width="1.3"/>
<text x="484.0" y="164.8" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">pages by error</text>
<text x="484.0" y="182.3" text-anchor="middle" font-size="10" fill="#52606d">band = ⌊log2 ε(parent)⌋;</text>
<text x="484.0" y="195.5" text-anchor="middle" font-size="10" fill="#52606d">coarse bands first,</text>
<text x="484.0" y="208.7" text-anchor="middle" font-size="10" fill="#52606d">leaf order inside;</text>
<text x="484.0" y="221.9" text-anchor="middle" font-size="10" fill="#52606d">P nodes a page; a box</text>
<text x="484.0" y="235.1" text-anchor="middle" font-size="10" fill="#52606d">and max ε per page</text>
<rect x="582" y="140" width="168" height="108" rx="6" fill="#fbf1df" stroke="#9a7433" stroke-width="1.3"/>
<text x="666.0" y="164.8" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">occlusion mask</text>
<text x="666.0" y="182.3" text-anchor="middle" font-size="10" fill="#52606d">open cells dilated 3×3,</text>
<text x="666.0" y="195.5" text-anchor="middle" font-size="10" fill="#52606d">OR up the tree;</text>
<text x="666.0" y="208.7" text-anchor="middle" font-size="10" fill="#52606d">conservative codebook</text>
<text x="666.0" y="221.9" text-anchor="middle" font-size="10" fill="#52606d">(entry 0 all open);</text>
<text x="666.0" y="235.1" text-anchor="middle" font-size="10" fill="#52606d">one index per node</text>
<rect x="400" y="268" width="350" height="76" rx="6" fill="#e6f1ea" stroke="#4f7a5c" stroke-width="1.3"/>
<text x="575.0" y="289.6" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">per-frame traversal</text>
<text x="575.0" y="307.4" text-anchor="middle" font-size="10.2" fill="#52606d">page needed when ε<tspan dy="2.9" font-size="7.3">max</tspan><tspan dy="-2.9"> p / max(dist(eye, box), near) &gt; τ</tspan></text>
<text x="575.0" y="320.9" text-anchor="middle" font-size="10.2" fill="#52606d">prune back faces of closed shells (normal cone)</text>
<text x="575.0" y="334.3" text-anchor="middle" font-size="10.2" fill="#52606d">and nodes whose cells toward the eye are all closed</text>
