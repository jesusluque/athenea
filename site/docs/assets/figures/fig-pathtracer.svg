<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3e4c59"/></marker></defs>
<rect width="760" height="250" fill="#ffffff"/>
<rect x="10" y="90" width="130" height="64" rx="6" fill="#eef2f7" stroke="#5b6b80" stroke-width="1.3"/>
<text x="75.0" y="118.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">visibility buffer</text>
<text x="75.0" y="137.4" text-anchor="middle" font-size="11" fill="#52606d">or lens rays</text>
<rect x="170" y="90" width="140" height="64" rx="6" fill="#e6f1ea" stroke="#4f7a5c" stroke-width="1.3"/>
<text x="240.0" y="118.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">rebuild the hit</text>
<text x="240.0" y="137.4" text-anchor="middle" font-size="11" fill="#52606d">material → lobe stack</text>
<rect x="340" y="20" width="190" height="74" rx="6" fill="#e6f1ea" stroke="#4f7a5c" stroke-width="1.3"/>
<text x="435.0" y="46.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">next-event estimation</text>
<text x="435.0" y="65.1" text-anchor="middle" font-size="11" fill="#52606d">choose light k by power</text>
<text x="435.0" y="79.6" text-anchor="middle" font-size="11" fill="#52606d">or light BVH; shadow ray</text>
<rect x="340" y="150" width="190" height="74" rx="6" fill="#e6f1ea" stroke="#4f7a5c" stroke-width="1.3"/>
<text x="435.0" y="176.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">sample the lobe stack</text>
<text x="435.0" y="195.1" text-anchor="middle" font-size="11" fill="#52606d">throughput × f|cos θ|/p</text>
<text x="435.0" y="209.6" text-anchor="middle" font-size="11" fill="#52606d">ray hits a light: lightHit</text>
<rect x="570" y="84" width="180" height="76" rx="6" fill="#f8e9e7" stroke="#9a4d42" stroke-width="1.3"/>
<text x="660.0" y="105.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">MIS (power heuristic)</text>
<text x="660.0" y="123.2" text-anchor="middle" font-size="10.5" fill="#52606d">w = p<tspan dy="2.9" font-size="7.6">l</tspan><tspan dy="-2.9">² / (p</tspan><tspan dy="2.9" font-size="7.6">l</tspan><tspan dy="-2.9">² + p</tspan><tspan dy="2.9" font-size="7.6">m</tspan><tspan dy="-2.9">²)</tspan></text>
<text x="660.0" y="137.1" text-anchor="middle" font-size="10.5" fill="#52606d">running mean of colour</text>
<text x="660.0" y="150.9" text-anchor="middle" font-size="10.5" fill="#52606d">× opacity; adaptive stop</text>
<polyline points="140,122 168,122" fill="none" stroke="#3e4c59" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="310,110 325,110 325,57 338,57" fill="none" stroke="#3e4c59" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="310,134 325,134 325,187 338,187" fill="none" stroke="#3e4c59" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="530,57 600,57 600,82" fill="none" stroke="#3e4c59" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="530,187 600,187 600,162" fill="none" stroke="#3e4c59" stroke-width="1.4" marker-end="url(#ah)"/>
<polyline points="435,226 435,240 240,240 240,156" fill="none" stroke="#3e4c59" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ah)"/>
<text x="330" y="236" text-anchor="middle" font-size="10.5" fill="#52606d" font-style="italic">next bounce</text>
</svg>
