<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neural athenea: what has been applied</title>
<style>
  body { margin: 0; background: #0b0c10; color: #e8e8ea; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.note { color: #9a9ca6; margin: 0 0 28px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid #23252d; padding: 14px 0; display: grid; grid-template-columns: 7.5rem 1fr; gap: 12px; }
  time { color: #9a9ca6; font-variant-numeric: tabular-nums; }
  a { color: #8ab4ff; }
  @media (max-width: 520px) { li { grid-template-columns: 1fr; gap: 2px; } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="note" id="note"></p>
  <ol id="entries"></ol>
</main>
<script type="module">
  // The page is its data: history.json beside it, newest first.
  const history = await (await fetch("./history.json", { cache: "no-store" })).json();
  document.getElementById("title").textContent = history.title;
  document.getElementById("note").textContent = history.note;
  const list = document.getElementById("entries");
  for (const entry of [...history.entries].reverse()) {
    const item = document.createElement("li");
    const when = document.createElement("time");
    when.dateTime = entry.date; when.textContent = entry.date;
    const what = document.createElement("div");
    what.textContent = entry.what;
    if (entry.scene) {
      const link = document.createElement("a");
      link.href = `./player.html?scene=${encodeURIComponent(entry.scene)}`;
      link.textContent = " See it";
      what.append(link);
    }
    item.append(when, what);
    list.append(item);
  }
</script>
</body>
</html>
