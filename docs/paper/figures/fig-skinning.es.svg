<text x="475.0" y="59.9" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">transforms de joint</text>
<text x="475.0" y="78.1" text-anchor="middle" font-size="10.5" fill="#52606d">X<tspan dy="2.9" font-size="7.6">j</tspan><tspan dy="-2.9"> = (A</tspan><tspan dy="2.9" font-size="7.6">j</tspan><tspan dy="-2.9">, t</tspan><tspan dy="2.9" font-size="7.6">j</tspan><tspan dy="-2.9">) en el</tspan></text>
<text x="475.0" y="92.0" text-anchor="middle" font-size="10.5" fill="#52606d">instante actual (UsdSkel)</text>
