<text x="275.0" y="183.9" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2933">skinning en GPU, un thread por Gaussian</text>
<text x="275.0" y="201.5" text-anchor="middle" font-size="10" fill="#52606d">media: μ′ = M Σ w<tspan dy="2.8" font-size="7.2">j</tspan><tspan dy="-2.8"> X</tspan><tspan dy="2.8" font-size="7.2">j</tspan><tspan dy="-2.8"> (G μ)</tspan></text>
<text x="275.0" y="214.7" text-anchor="middle" font-size="10" fill="#52606d">frame: J = L(M)[Σ w<tspan dy="2.8" font-size="7.2">j</tspan><tspan dy="-2.8"> A</tspan><tspan dy="2.8" font-size="7.2">j</tspan><tspan dy="-2.8"> L(G) + Σ (X</tspan><tspan dy="2.8" font-size="7.2">j</tspan><tspan dy="-2.8"> q) ∇w</tspan><tspan dy="2.8" font-size="7.2">j</tspan><tspan dy="-2.8">ᵀ]</tspan></text>
<text x="275.0" y="227.9" text-anchor="middle" font-size="10" fill="#52606d">covarianza: Σ′ = J Σ Jᵀ</text>
<rect x="440" y="150" width="150" height="100" rx="6" fill="#e6f1ea" stroke="#4f7a5c" stroke-width="1.3"/>
