<text x="488.25" y="78.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">sort</text>
<text x="488.25" y="95.8" text-anchor="middle" font-size="9.6" fill="#52606d">pairs by tile,</text>
<text x="488.25" y="108.5" text-anchor="middle" font-size="9.6" fill="#52606d">stable, ~15 bit</text>
<polyline points="427.1,88 439.6,88" fill="none" stroke="#3e4c59" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="549.4" y="40" width="94.3" height="96" rx="6" fill="#e6f1ea" stroke="#4f7a5c" stroke-width="1.3"/>
<text x="596.55" y="78.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">ranges</text>
<text x="596.55" y="95.8" text-anchor="middle" font-size="9.6" fill="#52606d">start and end</text>
<text x="596.55" y="108.5" text-anchor="middle" font-size="9.6" fill="#52606d">of each tile</text>
