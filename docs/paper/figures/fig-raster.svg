<text x="271.75" y="95.8" text-anchor="middle" font-size="9.6" fill="#52606d">counts in depth</text>
<text x="271.75" y="108.5" text-anchor="middle" font-size="9.6" fill="#52606d">order, prefix sum</text>
<polyline points="210.6,88 223.1,88" fill="none" stroke="#3e4c59" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="332.9" y="40" width="94.3" height="96" rx="6" fill="#e6f1ea" stroke="#4f7a5c" stroke-width="1.3"/>
<text x="380.04999999999995" y="78.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">emit</text>
<text x="380.04999999999995" y="95.8" text-anchor="middle" font-size="9.6" fill="#52606d">one (tile, splat)</text>
<text x="380.04999999999995" y="108.5" text-anchor="middle" font-size="9.6" fill="#52606d">pair per tile</text>
