<text x="380" y="24" text-anchor="middle" font-size="11" fill="#52606d">one compute kernel per stage, all on the device; per splat (first three) and per pair (last four)</text>
<text x="380" y="166" text-anchor="middle" font-size="11" fill="#52606d" font-style="italic">output: deterministic per-tile depth order, as a single 64-bit (tile, depth) sort would give</text>
