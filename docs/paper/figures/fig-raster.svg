<rect x="657.7" y="40" width="94.3" height="96" rx="6" fill="#e6f1ea" stroke="#4f7a5c" stroke-width="1.3"/>
<text x="704.85" y="72.6" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">blend</text>
<text x="704.85" y="89.5" text-anchor="middle" font-size="9.6" fill="#52606d">16 × 16 group per</text>
<text x="704.85" y="102.1" text-anchor="middle" font-size="9.6" fill="#52606d">tile, front to back;</text>
<text x="704.85" y="114.8" text-anchor="middle" font-size="9.6" fill="#52606d">stops at T &lt; 10⁻⁴</text>
