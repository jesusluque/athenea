<text x="55.15" y="89.5" text-anchor="middle" font-size="9.6" fill="#52606d">covariance, conic,</text>
<text x="55.15" y="102.1" text-anchor="middle" font-size="9.6" fill="#52606d">colour, depth key,</text>
<text x="55.15" y="114.8" text-anchor="middle" font-size="9.6" fill="#52606d">tiles touched</text>
