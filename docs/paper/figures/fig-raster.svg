<text x="163.45" y="78.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">sort</text>
<text x="163.45" y="95.8" text-anchor="middle" font-size="9.6" fill="#52606d">splats by depth</text>
<text x="163.45" y="108.5" text-anchor="middle" font-size="9.6" fill="#52606d">(RadixSort, 32 bit)</text>
<polyline points="102.3,88 114.8,88" fill="none" stroke="#3e4c59" stroke-width="1.4" marker-end="url(#ah)"/>
