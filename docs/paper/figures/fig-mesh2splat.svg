<polyline points="663.5,114 663.5,138 60,138 60,164" fill="none" stroke="#3e4c59" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="380" y="18" text-anchor="middle" font-size="11" fill="#52606d" font-style="italic">the host orchestrates; every step that touches the mesh is a kernel or the Mesh2Splat AOFX effect</text>
