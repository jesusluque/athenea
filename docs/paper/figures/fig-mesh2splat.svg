<text x="682.4" y="208.9" text-anchor="middle" font-size="10" fill="#52606d">ParticleField3D-</text>
<text x="682.4" y="222.1" text-anchor="middle" font-size="10" fill="#52606d">GaussianSplat in</text>
<text x="682.4" y="235.3" text-anchor="middle" font-size="10" fill="#52606d">.usdc or .athc</text>
