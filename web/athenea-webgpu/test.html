<!-- The web module alone: ?url=<a 3DGS .ply> draws it with the renderer slot's
     module, and prints its stats. Served by any static server from the
     directory scripts/web-kernels.py writes. Optional: &eye=x,y,z&target=x,y,z
     &fov=degrees (vertical) for a camera to compare against `athenea render`,
     &shot=name to download a webp of the frame once it has drawn,
     &transform={"scale":0.01} (JSON, as a scene.json gives it), &linear=1 to
     blend in linear light rather than display sRGB. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>athenea WebGPU test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0b0f; color: #ddd; font: 13px system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #stats { position: fixed; left: 12px; top: 10px; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="stats">loading…</div>
<script type="module">
  import { createRenderer } from "./athenea-webgpu.js";
  const out = document.getElementById("stats");
  const params = new URLSearchParams(location.search);
  const url = params.get("url");
  if (!url) {
    out.textContent = "?url=<a 3DGS .ply>";
  } else {
    try {
      const r = await createRenderer({
        canvas: document.getElementById("view"), scene: {}, file: { format: "ply", transform: params.get("transform") ? JSON.parse(params.get("transform")) : undefined }, url: new URL(url, location.href).href,
        onProgress: (f, bytes) => { out.textContent = `loading ${f == null ? "" : Math.round(f * 100) + "% "}${(bytes / 1e6).toFixed(1)} MB`; },
      });
      window.renderer = r;
      if (params.get("linear")) r.setFeatures({ linear: params.get("linear") === "1" });
      const vec = (k) => params.get(k)?.split(",").map(Number);
      if (params.get("eye")) r.setCamera({ position: vec("eye"), target: vec("target") ?? [0, 0, 0], fov: Number(params.get("fov") ?? 50) });
      if (params.get("shot")) {
        setTimeout(async () => {
          const blob = await r.snapshot();
          const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `${params.get("shot")}.webp` });
          a.click();
        }, 1500);
      }
      setInterval(() => {
        const s = r.stats();
        out.textContent = `${r.name} · ${r.backend}\n${s.rendered} / ${s.total} splats · ${s.fps.toFixed(1)} fps\n${s.extra}`;
      }, 500);
    } catch (e) {
      out.textContent = String(e && e.message || e);
      console.error(e);
    }
  }
</script>
</body>
</html>
